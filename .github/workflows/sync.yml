name: Sync likes

# Manual only: click "Run workflow". There is no schedule.
on:
  workflow_dispatch:
    inputs:
      latest:
        description: "Copy Main's newest N missing likes to Secondary (one-way). Empty = full two-way sync."
        type: string
        default: "190"
      dry_run:
        description: "Dry run (show what would change, change nothing)"
        type: boolean
        default: false

concurrency:
  group: sync-likes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore sync state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: likes-state-${{ github.run_id }}
          restore-keys: likes-state-

      - name: Sync
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          MAIN_REFRESH_TOKEN: ${{ secrets.MAIN_REFRESH_TOKEN }}
          SECONDARY_REFRESH_TOKEN: ${{ secrets.SECONDARY_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          LATEST: ${{ inputs.latest }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$LATEST" ]; then args+=(--latest "$LATEST"); fi
          python sync_likes.py "${args[@]}"

      - name: Save sync state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: likes-state-${{ github.run_id }}-${{ github.run_attempt }}
